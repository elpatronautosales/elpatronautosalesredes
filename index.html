<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090312">
<meta name="description" content="El Patrón Auto Sales — Redes sociales, contacto por WhatsApp y catálogo de vehículos.">
<title>El Patrón Auto Sales</title>
<style>
:root{--bg:#08020f;--purple:#7419ff;--pink:#ff1ca8;--cyan:#3fe7ff;--green:#25d366;--glass:rgba(18,7,35,.78)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{background:radial-gradient(circle at 50% 0%,rgba(125,24,255,.28),transparent 34%),var(--bg)}
.page{min-height:100vh;overflow:hidden;background:linear-gradient(180deg,rgba(8,2,15,.04) 0%,rgba(8,2,15,.5) 42%,#08020f 82%)}
.wrap{width:min(100%,560px);margin:0 auto;padding:14px 16px 28px}
.banner{width:100%;display:block;aspect-ratio:1536/588;object-fit:cover;border-radius:22px;border:1px solid rgba(255,255,255,.2);box-shadow:0 0 32px rgba(130,25,255,.3),0 18px 48px rgba(0,0,0,.45)}
.profile{text-align:center;margin-top:-42px;position:relative}.avatar{width:96px;height:96px;display:block;margin:0 auto;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 5px rgba(255,28,168,.22),0 0 32px rgba(255,28,168,.5)}
h1{margin:12px 0 2px;font-size:29px;line-height:1;letter-spacing:-1px;font-weight:950;text-transform:uppercase;text-shadow:0 0 12px rgba(255,255,255,.3),0 0 24px rgba(255,28,168,.42)}
.handle{color:#d8cde2;font-size:13px;font-weight:800;letter-spacing:.6px}.pitch{margin:14px auto 20px;font-size:14px;line-height:1.5;font-weight:750;max-width:450px}.pitch strong{color:#fff}
.links{display:grid;gap:11px}.btn{min-height:58px;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 16px;border:1px solid rgba(255,255,255,.18);border-radius:17px;background:var(--glass);color:#fff;text-decoration:none;font-size:16px;font-weight:900;box-shadow:0 12px 28px rgba(0,0,0,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s ease,filter .15s ease}.btn:active{transform:scale(.985);filter:brightness(1.08)}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;flex:0 0 34px}.btn svg{width:20px;height:20px;display:block;fill:currentColor;stroke:currentColor;stroke-width:0}.btn.instagram svg{fill:none;stroke:currentColor;stroke-width:1.9}.btn.instagram .dot{fill:currentColor;stroke:none}
.tiktok .icon{background:linear-gradient(135deg,rgba(0,242,234,.25),rgba(255,0,80,.28))}
.catalogo{background:linear-gradient(105deg,rgba(116,25,255,.92),rgba(255,28,168,.90));border-color:rgba(255,255,255,.28);box-shadow:0 14px 34px rgba(116,25,255,.28),0 0 24px rgba(255,28,168,.14)}.catalogo .icon{background:rgba(255,255,255,.16)}.catalogo:hover{filter:brightness(1.08)}.instagram .icon{background:linear-gradient(135deg,rgba(255,210,70,.2),rgba(255,20,147,.3))}.facebook .icon{background:rgba(24,119,242,.28)}
.wa{background:linear-gradient(105deg,rgba(16,135,72,.95),rgba(7,65,38,.92));border-color:rgba(37,211,102,.34)}.wa .icon{background:rgba(37,211,102,.18)}
.section-label{display:flex;align-items:center;gap:10px;margin:22px 2px 10px;color:#c9bfd1;font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:900}.section-label:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent)}
.footer{text-align:center;margin-top:22px;color:#8f8499;font-size:10px;letter-spacing:1.3px;font-weight:800}
@media(min-width:700px){.wrap{padding-top:24px}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}}
</style>
