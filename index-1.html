.wrap { position:relative; z-index:1; width:min(520px,92vw); margin:auto; padding:14px 0 34px; }
.banner {
  width:100%; aspect-ratio:1536/588; object-fit:cover; display:block;
  border-radius:22px; border:1px solid rgba(255,255,255,.18);
  box-shadow:0 0 35px rgba(151,35,255,.30), 0 18px 50px rgba(0,0,0,.45);
}
.profile { text-align:center; margin-top:-30px; }
.avatar {
  width:94px; height:94px; margin:0 auto; border-radius:50%;
  object-fit:cover; object-position:center;
  border:3px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 5px rgba(255,24,168,.22), 0 0 35px rgba(255,24,168,.55);
}
h1 {
  margin:13px 0 3px; font-size:29px; line-height:1; letter-spacing:-1px;
  font-weight:950; text-transform:uppercase;
  text-shadow:0 0 12px rgba(255,255,255,.35),0 0 24px rgba(255,24,168,.45);
}
.handle { color:#d9cfe4; font-size:13px; font-weight:700; letter-spacing:.5px; }
.pitch {
  margin:15px auto 20px; font-size:14px; line-height:1.5; font-weight:750;
  color:#fff; max-width:420px;
}
.pitch span {
  background:linear-gradient(90deg,var(--pink),var(--cyan));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.links { display:grid; gap:12px; }
.btn {
  position:relative; min-height:62px; padding:12px 18px;
  display:flex; align-items:center; justify-content:center; gap:12px;
  border-radius:18px; color:#fff; text-decoration:none; font-size:16px; font-weight:900;
  background:linear-gradient(105deg,rgba(24,11,43,.88),rgba(9,8,21,.76));
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 12px 28px rgba(0,0,0,.28), inset 0 0 20px rgba(255,255,255,.025);
  backdrop-filter:blur(14px);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.btn:hover {
  transform:translateY(-2px);
  border-color:rgba(255,255,255,.38);
  box-shadow:0 15px 35px rgba(0,0,0,.38),0 0 24px rgba(173,33,255,.22);
}
.btn .icon {
  width:28px; height:28px; display:grid; place-items:center; flex:0 0 28px;
  border-radius:9px; background:rgba(255,255,255,.09);
}
.btn svg { width:20px; height:20px; fill:currentColor; stroke:currentColor; stroke-width:0; }
.btn.instagram svg { fill:none; stroke:currentColor; stroke-width:1.9; }
.btn.instagram svg .fill { fill:currentColor; stroke:none; }
.btn.facebook svg { fill:currentColor; }
.btn.tiktok { box-shadow:0 12px 28px rgba(0,0,0,.28), 0 0 22px rgba(255,24,168,.10); }
.btn.tiktok .icon { background:linear-gradient(135deg,rgba(0,242,234,.22),rgba(255,0,80,.24)); }
.btn.instagram .icon { background:linear-gradient(135deg,rgba(255,210,70,.20),rgba(255,20,147,.28)); }
.btn.facebook .icon { background:rgba(24,119,242,.28); }
.btn.wa {
  background:linear-gradient(105deg,rgba(16,135,72,.92),rgba(8,67,39,.9));
  border-color:rgba(37,211,102,.34);
  box-shadow:0 12px 30px rgba(0,0,0,.3),0 0 22px rgba(37,211,102,.10);
}
.btn.wa .icon { background:rgba(37,211,102,.18); }
.section-label {
  display:flex; align-items:center; gap:10px; margin:22px 2px 10px;
  color:#c8bfd0; font-size:11px; text-transform:uppercase; letter-spacing:2px; font-weight:900;
}
.section-label::before,.section-label::after { content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,rgba(255,255,255,.18)); }
.section-label::after { background:linear-gradient(90deg,rgba(255,255,255,.18),transparent); }
.footer { text-align:center; margin-top:22px; color:#92889b; font-size:10px; letter-spacing:1.3px; font-weight:700; }
</style>
</head>
